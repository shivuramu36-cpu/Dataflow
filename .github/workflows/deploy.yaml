name: Dataflow CI/CD Pipeline

on:
  push:
    branches: [ main ]

env:
  PROJECT_ID: "my-project123-503415"
  REGION: "asia-south1"
  REGISTRY: "asia-south1-docker.pkg.dev"
  BUCKET_NAME: "dataflow_shiva_test"

jobs:
  ci-cd:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Define the exact names, files, and metadata templates here
        pipeline: [
          { name: "pipeline", dockerfile: "Docker", metadata: "metadata.json" }
        ]

    steps:
    # --- CI STAGE ---
    - name: Set up Python
      uses: actions/setup-python@v5.4.0  # Or look up the absolute latest v5 patch release
      with:
        # Optional: Enable caching for faster future runs
        cache: 'pip'
        cache-dependency-path: 'requirements.txt'

    - name: Install Dependencies & Run Unit Tests
      run: |
        # 1. Upgrade critical compilation tools first
        python -m pip install --upgrade pip setuptools wheel

        # 2. Call the discovery script to install your requirements
        if [ -f "pipeline/requirements.txt" ]; then
          echo "Found requirements inside pipeline/ folder"
          pip install -r pipeline/requirements.txt
        elif [ -f "requirements.txt" ]; then
          echo "Found requirements inside root folder"
          pip install -r requirements.txt
        fi

        # 3. Install pytest and run it on the current working directory (.) instead of pipeline/
        pip install pytest
        pytest .  # <-- Changed from 'pipeline/' to '.'





    # --- AUTH STAGE ---
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker for Artifact Registry
      run: |
        gcloud auth configure-docker ${{ env.REGISTRY }}

     # --- DYNAMIC MATRIX BUILD STAGE ---
    - name: Build and Push Docker Image
      run: |
        # Fixed path resolution string below:
        TAG="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/dataflow-apps/${{ matrix.pipeline.name }}:${{ github.sha }}"
        
        # Build using the correct file parameter from the matrix
        docker build -f ${{ matrix.pipeline.dockerfile }} -t $TAG .
        docker push $TAG
        
        # Save tag dynamically for the subsequent build steps
        echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV

    - name: Build Dataflow Flex Template
      run: |
        gcloud dataflow templates build "gs://${{ env.BUCKET_NAME }}/templates/${{ matrix.pipeline.name }}-${{ github.sha }}.json" \
          --image "${{ env.IMAGE_TAG }}" \
          --sdk-language "PYTHON" \
          --metadata-file "${{ matrix.pipeline.metadata }}"

    - name: Run Dataflow Job
      run: |
        gcloud dataflow flex-template run "${{ matrix.pipeline.name }}-${{ github.sha }}" \
          --template-file-gcs-location "gs://${{ env.BUCKET_NAME }}/templates/${{ matrix.pipeline.name }}-${{ github.sha }}.json" \
          --region "${{ env.REGION }}"
