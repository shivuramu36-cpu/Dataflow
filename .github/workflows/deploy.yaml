name: Dataflow CI/CD Pipeline

on:
  push:
    branches: [ main ]

env:
  PROJECT_ID: "my-project123-503415"
  REGION: "asia-south1"
  REGISTRY: "asia-south1-docker.pkg.dev"
  BUCKET_NAME: "dataflow_shiva_test"

jobs:
  deploy-pipelines:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4.2.2

    - name: Set up Python
      uses: actions/setup-python@v5.4.0
      with:
        python-version: '3.11'

    - name: Install Dependencies & Run Unit Tests
      run: |
        python -m pip install --upgrade pip setuptools wheel
        if [ -f "pipeline/requirements.txt" ]; then
          pip install -r pipeline/requirements.txt
        elif [ -f "requirements.txt" ]; then
          pip install -r requirements.txt
        fi
        echo "def test_placeholder(): assert True" > test_workflow_generated.py
        pip install pytest
        pytest test_workflow_generated.py

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker
      run: gcloud auth configure-docker ${{ env.REGISTRY }}

    # ==========================================
    # 🚀 PIPELINE A: BUILD & DEPLOY
    # ==========================================
    - name: Build and Push Docker Image (Pipeline A)
      run: |
        TAG_A="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/dataflow-apps/pipeline:${{ github.sha }}"
        docker build -f Dockerfile -t "$TAG_A" .
        docker push "$TAG_A"
        echo "IMAGE_TAG_A=$TAG_A" >> $GITHUB_ENV

    - name: Build Dataflow Flex Template (Pipeline A)
      run: |
        gcloud dataflow flex-template build "gs://${{ env.BUCKET_NAME }}/templates/pipeline-latest.json" \
          --image "${{ env.IMAGE_TAG_A }}" \
          --sdk-language "PYTHON" \
          --metadata-file "metadata.json"

    - name: Run Dataflow Job (Pipeline A)
      run: |
        gcloud dataflow flex-template run "pipeline-${{ github.sha }}" \
          --template-file-gcs-location "gs://${{ env.BUCKET_NAME }}/templates/pipeline-latest.json" \
          --region "${{ env.REGION }}" \
          --parameters input="gs:/customers-shiva/customers-shiva.csv" # <-- Change to your CSV path
